<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الأسعار — مكتبة نيرول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient" aria-hidden="true">
        <span class="ambient-shape shape-1"></span>
        <span class="ambient-shape shape-2"></span>
        <span class="ambient-shape shape-3"></span>
        <span class="ambient-dot dot-1"></span>
        <span class="ambient-dot dot-2"></span>
        <span class="ambient-dot dot-3"></span>
    </div>

    <header class="navbar">
        <div class="navbar-inner">
            <a href="#" class="brand-link" aria-label="مكتبة نيرول">
                <img class="brand-logo" src="logo.png" alt="مكتبة نيرول" width="812" height="180">
            </a>
            <span class="navbar-rule" aria-hidden="true"></span>
            <span class="badge-pill">حاسبة الاسعار</span>
            <span class="badge-icon" role="img" aria-label="حاسبة الاسعار">
                <img src="calc-icon.png" alt="" width="190" height="240">
            </span>
        </div>
    </header>

    <div class="content-grid">
    <div class="page">

        <section class="hero" id="calculator">

            <div class="hero-content reveal-item reveal-delay-1">
                <h1>احسب بدقة <span class="bang">!</span></h1>
                <p class="hero-desc">
                    اختر حجم الورق، ونوع الطباعة، وعدد الأوجه، وطريقة التغليف،
                    ثم أدخل عدد الصفحات لتحصل على السعر مباشرة
                </p>
            </div>

            <div class="calc-card reveal-item reveal-delay-2">

                <div class="qty-field">
                    <label for="paperCount">عدد الصفحات:</label>
                    <div class="qty-box" dir="ltr">
                        <button type="button" id="increaseBtn" aria-label="زيادة العدد">+</button>
                        <input type="number" id="paperCount" min="0" value="0" inputmode="numeric">
                        <button type="button" id="decreaseBtn" aria-label="إنقاص العدد">−</button>
                    </div>
                </div>

                <div class="field-grid reveal-stagger">
                    <div class="select-field reveal-child">
                        <label for="sizeSelect">حجم الورق:</label>
                        <div class="select-wrap">
                            <select id="sizeSelect" data-size-select>
                                <option value="" disabled selected>يرجى الاختيار...</option>
                                <option value="A5">A5</option>
                                <option value="A4">A4</option>
                                <option value="A3">A3</option>
                            </select>
                        </div>
                    </div>

                    <div class="select-field reveal-child">
                        <label for="colorSelect">الألوان:</label>
                        <div class="select-wrap">
                            <select id="colorSelect" data-color-select>
                                <option value="" disabled selected>يرجى الاختيار...</option>
                                <option value="bw">أسود وأبيض</option>
                                <option value="color">ملون</option>
                            </select>
                        </div>
                    </div>

                    <div class="select-field reveal-child">
                        <label for="sidesSelect">عدد الاوجه:</label>
                        <div class="select-wrap">
                            <select id="sidesSelect" data-sides-select>
                                <option value="" disabled selected>يرجى الاختيار...</option>
                                <option value="single">وجه واحد</option>
                                <option value="double">وجه وقفى</option>
                            </select>
                        </div>
                    </div>

                    <div class="select-field reveal-child">
                        <label for="bindingSelect">التغليف:</label>
                        <div class="select-wrap">
                            <select id="bindingSelect" data-binding-select>
                                <option value="" disabled selected>يرجى الاختيار...</option>
                                <option value="none">بدون تغليف</option>
                                <option value="spiral">حلزوني</option>
                                <option value="tape">شطرطون</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button type="button" id="calculateBtn" class="calculate-btn">انقر للحساب</button>

            </div>

        </section>

        <section id="result" class="result-section hidden" aria-live="polite">

            <div class="result-heading">
                <h2>ملخص<br class="lb"> الفاتورة:</h2>
            </div>

            <div class="result-card">
                <div class="result-rows">
                    <div class="result-row">
                        <strong id="printingPrice">-</strong>
                        <span id="resultSizeLine">-</span>
                    </div>
                    <div class="result-row">
                        <strong>-</strong>
                        <span id="resultColor">-</span>
                    </div>
                    <div class="result-row">
                        <strong>-</strong>
                        <span id="resultSides">-</span>
                    </div>
                    <div class="result-row">
                        <strong id="bindingPrice">-</strong>
                        <span id="resultBinding">-</span>
                    </div>
                    <div class="result-row result-row--total">
                        <strong id="totalPrice">0 ﷼</strong>
                        <span>:الاجمالي</span>
                    </div>
                </div>
            </div>

        </section>

    </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
